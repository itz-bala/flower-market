<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <title>Sales Management</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-success">

    <div class="container-fluid">

        <a class="navbar-brand">
            🛒 Sales Management
        </a>

        <a href="/dashboard" class="btn btn-light">
            Dashboard
        </a>

    </div>

</nav>

<div class="container mt-4">

    <h2 class="mb-4">New Sale</h2>

    <form th:action="@{/saveSale}" th:object="${sale}" method="post">

        <div class="row">

            <div class="col-md-4 mb-3">
                <input
                        class="form-control"
                        th:field="*{customerName}"
                        placeholder="Customer Name"
                        required>
            </div>

            <div class="col-md-4 mb-3">
                <input
                        class="form-control"
                        th:field="*{customerPhone}"
                        placeholder="Phone Number"
                        required>
            </div>

            <!-- Flower Dropdown -->
            <div class="col-md-4 mb-3">

                <select class="form-select"
                        th:field="*{flowerName}"
                        required>

                    <option value="">Select Flower</option>

                    <option
                            th:each="flower : ${flowers}"
                            th:value="${flower.flowerName}"
                            th:text="${flower.flowerName}">
                    </option>

                </select>

            </div>

            <!-- Price -->
            <div class="col-md-4 mb-3">

                <input
                        class="form-control"
                        type="number"
                        step="0.01"
                        th:field="*{price}"
                        placeholder="Price (Auto Filled)"
                        readonly>

            </div>

            <!-- Quantity -->
            <div class="col-md-4 mb-3">

                <input
                        class="form-control"
                        type="number"
                        th:field="*{quantity}"
                        placeholder="Quantity"
                        required>

            </div>

            <div class="col-md-4 mb-3">

                <button
                        type="submit"
                        class="btn btn-success w-100">

                    Save Sale

                </button>

            </div>

        </div>

    </form>

    <hr>

    <h3>Sales History</h3>

    <table class="table table-bordered table-hover">

        <thead class="table-success">

        <tr>

            <th>ID</th>
            <th>Customer</th>
            <th>Phone</th>
            <th>Flower</th>
            <th>Price</th>
            <th>Quantity</th>
            <th>Total</th>
            <th>Date</th>

        </tr>

        </thead>

        <tbody>

        <tr th:each="sale : ${sales}">

            <td th:text="${sale.id}"></td>
            <td th:text="${sale.customerName}"></td>
            <td th:text="${sale.customerPhone}"></td>
            <td th:text="${sale.flowerName}"></td>
            <td th:text="${sale.price}"></td>
            <td th:text="${sale.quantity}"></td>
            <td th:text="${sale.totalAmount}"></td>
            <td th:text="${sale.saleDate}"></td>

        </tr>

        </tbody>

    </table>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
