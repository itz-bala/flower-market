<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <title>Stock Management</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-success">

    <div class="container-fluid">

        <a class="navbar-brand">
            📦 Stock Management
        </a>

        <a href="/dashboard" class="btn btn-light">
            Dashboard
        </a>

    </div>

</nav>

<div class="container mt-4">

    <h2 class="mb-4">Current Stock</h2>

    <table class="table table-bordered table-hover">

        <thead class="table-success">

        <tr>

            <th>ID</th>
            <th>Flower</th>
            <th>Current Stock</th>
            <th>Minimum Stock</th>
            <th>Status</th>
            <th>Action</th>

        </tr>

        </thead>

        <tbody>

        <tr th:each="flower : ${flowers}">

            <form th:action="@{/updateStock}" method="post">

                <input type="hidden"
                       name="id"
                       th:value="${flower.id}">

                <td th:text="${flower.id}"></td>

                <td th:text="${flower.flowerName}"></td>

                <td>

                    <input
                            class="form-control"
                            type="number"
                            name="stockQuantity"
                            th:value="${flower.stockQuantity}">

                </td>

                <td th:text="${flower.minimumStock}"></td>

                <td>

                    <span
                            th:if="${flower.stockQuantity==0}"
                            class="badge bg-danger">

                        Out Of Stock

                    </span>

                    <span
                            th:if="${flower.stockQuantity>0 and flower.stockQuantity<=flower.minimumStock}"
                            class="badge bg-warning text-dark">

                        Low Stock

                    </span>

                    <span
                            th:if="${flower.stockQuantity>flower.minimumStock}"
                            class="badge bg-success">

                        In Stock

                    </span>

                </td>

                <td>

                    <button
                            type="submit"
                            class="btn btn-primary btn-sm">

                        Update

                    </button>

                </td>

            </form>

        </tr>

        </tbody>

    </table>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
