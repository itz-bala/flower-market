<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">
<title>Flower Analytics Dashboard</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="manifest" th:href="@{/manifest.json}">
<meta name="theme-color" content="#198754">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">


</head>

<body class="bg-light">

	<nav class="navbar navbar-dark bg-success">

	    <div class="container-fluid">

	        <!-- Left Side -->
	        <a class="navbar-brand">
	            📊 Flower Analytics Dashboard
	        </a>

	        <!-- Right Side -->
	        <div class="d-flex align-items-center ms-auto">

	            <a href="/dashboard" class="btn btn-light me-2">
	                Dashboard
	            </a>

	            

	        </div>

	    </div>

	</nav>

<div class="container mt-4">

<h2 class="mb-4">Business Analytics</h2>

<div class="row">

<div class="col-md-3">

<div class="card text-bg-primary mb-3">

<div class="card-body">

<h5>Total Flowers</h5>

<h2 th:text="${totalFlowers}"></h2>

</div>

</div>

</div>

<div class="col-md-3">

<div class="card text-bg-success mb-3">

<div class="card-body">

<h5>Total Stock</h5>

<h2 th:text="${totalStock}"></h2>

</div>

</div>

</div>

<div class="col-md-3">

<div class="card text-bg-warning mb-3">

<div class="card-body">

<h5>Total Sales</h5>

<h2 th:text="${totalSales}"></h2>

</div>

</div>

</div>

<div class="col-md-3">

<div class="card text-bg-danger mb-3">

<div class="card-body">

<h5>Total Revenue</h5>

<h2>₹ <span th:text="${totalRevenue}"></span></h2>

</div>

</div>

</div>

</div>

<hr>

<h3>Business Summary</h3>

<table class="table table-bordered">

<tr>
<th>Metric</th>
<th>Value</th>
</tr>

<tr>
<td>Total Flowers</td>
<td th:text="${totalFlowers}"></td>
</tr>

<tr>
<td>Total Stock</td>
<td th:text="${totalStock}"></td>
</tr>

<tr>
<td>Total Sales</td>
<td th:text="${totalSales}"></td>
</tr>

<tr>
<td>Total Revenue</td>
<td th:text="${totalRevenue}"></td>
</tr>

</table>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<script th:src="@{/js/theme.js}"></script>


<script>
if ('serviceWorker' in navigator) {

    window.addEventListener('load', () => {

        navigator.serviceWorker.register('/service-worker.js')

        .then(reg => {

            console.log("PWA Installed");

        })

        .catch(err => {

            console.log(err);

        });

    });

}
</script>

</body>

</html>
