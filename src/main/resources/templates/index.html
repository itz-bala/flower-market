<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<title>Flower Dashboard</title>

<link rel="stylesheet" th:href="@{/css/style.css}">


<link rel="manifest" th:href="@{/manifest.json}">
<meta name="theme-color" content="#198754">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">


</head>

<body>

<h1>🌸 Flower Inventory Dashboard</h1>



<div class="cards">

    <div class="card">
        <h3>Total Flowers</h3>
        <h2 th:text="${totalFlowers}"></h2>
    </div>

    <div class="card">
        <h3>Total Stock</h3>
        <h2 th:text="${totalStock}"></h2>
    </div>

    <div class="card">
        <h3>Low Stock</h3>
        <h2 th:text="${lowStock}"></h2>
    </div>

    <div class="card">
        <h3>Inventory Value</h3>
        <h2>₹ <span th:text="${inventoryValue}"></span></h2>
    </div>

</div>

<br>



<form th:action="@{/saveFlower}" th:object="${flower}" method="post">

    <input type="text" th:field="*{flowerName}" placeholder="Flower Name" required><br><br>

    <input type="text" th:field="*{category}" placeholder="Category" required><br><br>

    <input type="number" step="0.01" th:field="*{price}" placeholder="Price" required><br><br>

    <input type="number" th:field="*{stockQuantity}" placeholder="Stock Quantity" required><br><br>
	
	<input type="number"
	       th:field="*{minimumStock}"
	       placeholder="Minimum Stock"
	       required><br><br>

    <input type="text" th:field="*{supplier}" placeholder="Supplier" required><br><br>

    <button type="submit">Save Flower</button>

</form>

<hr>


<form th:action="@{/search}" method="get">

    <input type="text"
           name="keyword"
           placeholder="Search Flower Name">

    <button type="submit">Search</button>

    <a th:href="@{/}">
        <button type="button">Clear</button>
    </a>

</form>

<br>


<h2>Flower List</h2>

<table border="1">

<tr>
<th>ID</th>
<th>Name</th>
<th>Category</th>
<th>Price</th>
<th>Stock</th>
<th>Supplier</th>
<th>Date</th>
</tr>

<tr th:each="flower : ${flowers}">

<td th:text="${flower.id}"></td>
<td th:text="${flower.flowerName}"></td>
<td th:text="${flower.category}"></td>
<td th:text="${flower.price}"></td>
<td th:text="${flower.stockQuantity}"></td>
<td th:text="${flower.supplier}"></td>
<td th:text="${flower.addedDate}"></td>
<td>
    <a th:href="@{/edit/{id}(id=${flower.id})}">Edit</a> |
    <a th:href="@{/delete/{id}(id=${flower.id})}"
       onclick="return confirm('Are you sure?')">Delete</a>
</td>

</tr>



</table>

<script>
if ('serviceWorker' in navigator) {

    window.addEventListener('load', () => {

        navigator.serviceWorker.register('/service-worker.js')

        .then(reg => {

            console.log("PWA Installed");

        })

        .catch(err => {

            console.log(err);

        });

    });

}
</script>

</body>
</html>
