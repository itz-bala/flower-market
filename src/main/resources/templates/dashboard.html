<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Flower Dashboard</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <link rel="stylesheet" th:href="@{/css/style.css}">
	
	
	
	<link rel="manifest" th:href="@{/manifest.json}">
	<meta name="theme-color" content="#198754">
	<meta name="mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-capable" content="yes">
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-success">
    <div class="container-fluid">

        <a class="navbar-brand fw-bold" href="#">
            🌸 Flower Inventory Dashboard
        </a>

		<div class="d-flex align-items-center">

		            <span class="text-white me-3">
		                Welcome Admin
		            </span>

		            <button
		                class="btn btn-warning"
		                onclick="toggleTheme()">

		                🌙 / ☀

		            </button>

		        </div>


    </div>
</nav>

<div class="container-fluid">

<div class="row">

<!-- Sidebar -->

<div class="col-md-2 bg-dark text-white vh-100">

<h4 class="mt-4 text-center">MENU</h4>

<hr>

<div class="list-group">

<a href="/dashboard" class="list-group-item list-group-item-action">
🏠 Dashboard
</a>

<a href="/flowers" class="list-group-item list-group-item-action">
🌹 Flowers
</a>

<a href="/stock" class="list-group-item list-group-item-action">
📦 Stock
</a>

<a href="/sales" class="list-group-item list-group-item-action">
🛒 Sales
</a>

<a href="/suppliers" class="list-group-item list-group-item-action">
🚚 Suppliers
</a>

<a href="/analytics" class="list-group-item list-group-item-action">
📈 Analytics
</a>

</div>

</div>

<!-- Main Content -->

<div class="col-md-10 p-4">

<h2>Dashboard</h2>

<div class="row mt-4">

<div class="col-md-3">

<div class="card bg-primary text-white">

<div class="card-body">

<h5>Total Flowers</h5>

<h2 th:text="${totalFlowers}"></h2>

</div>

</div>

</div>

<div class="col-md-3">

<div class="card bg-success text-white">

<div class="card-body">

<h5>Total Stock</h5>

<h2 th:text="${totalStock}"></h2>

</div>

</div>

</div>

<div class="col-md-3">

<div class="card bg-warning text-dark">

<div class="card-body">

<h5>Low Stock</h5>

<h2 th:text="${lowStock}"></h2>

</div>

</div>

</div>

<div class="col-md-3">

<div class="card bg-danger text-white">

<div class="card-body">

<h5>Inventory Value</h5>

<h2>₹ <span th:text="${inventoryValue}"></span></h2>

</div>

</div>

</div>

</div>

<hr>

<h3>Recent Flowers</h3>

<table class="table table-bordered table-hover">

<thead class="table-success">

<tr>

<th>ID</th>
<th>Name</th>
<th>Category</th>
<th>Price</th>
<th>Stock</th>
<th>Supplier</th>

</tr>

</thead>

<tbody>

<tr th:each="flower : ${flowers}">

<td th:text="${flower.id}"></td>
<td th:text="${flower.flowerName}"></td>
<td th:text="${flower.category}"></td>
<td th:text="${flower.price}"></td>
<td th:text="${flower.stockQuantity}"></td>
<td th:text="${flower.supplier}"></td>

</tr>

</tbody>

</table>

</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<script th:src="@{/js/theme.js}"></script>


<script>
if ('serviceWorker' in navigator) {

    window.addEventListener('load', () => {

        navigator.serviceWorker.register('/service-worker.js')

        .then(reg => {

            console.log("PWA Installed");

        })

        .catch(err => {

            console.log(err);

        });

    });

}
</script>

</body>

</html>
